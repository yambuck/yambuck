# Builds every release asset on GitHub and attaches it to a pre-release.
#
#   Tag push (vX.Y.Z): creates the pre-release (notes skeleton from
#     release-notes-template.mjs), builds Linux inside the pinned Ubuntu 22.04
#     container, uploads the assets, verifies the release is complete, then
#     install-tests it with the installer scripts from the tag.
#     Promotion to latest stays a deliberate step: npm run release:promote.
#   Manual run (Actions tab or `gh workflow run release.yml --ref <branch>`):
#     a dry run that builds and packages, keeping the files as workflow
#     artifacts, without touching any release.
#
# Asset names come only from scripts/release-assets.mjs via package-release.mjs.
# See docs/RELEASE.md and the Release and Update Standard.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read release version
        id: version
        run: |
          tag="v$(node -p "require('./apps/yambuck-gui/src-tauri/tauri.conf.json').version")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${tag}"

      - name: Check tag matches the configured version
        if: env.PUBLISH == 'true'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.tag }}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${{ steps.version.outputs.tag }}. Use npm run release:prepare."
            exit 1
          fi

      - name: Create pre-release
        if: env.PUBLISH == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
          else
            npm run --silent release:notes > release-notes.md
            gh release create "$tag" --verify-tag --prerelease --title "$tag" --notes-file release-notes.md
          fi

  build:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Builds inside the pinned Ubuntu 22.04 container (glibc floor), exactly
      # as a local `npm run release:linux` does.
      - name: Build Linux release
        run: npm run release:linux

      - name: Package release assets
        run: node scripts/package-release.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: release-Linux
          path: release-artifacts/*
          retention-days: 14

      - name: Upload to release
        if: env.PUBLISH == 'true'
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release-artifacts/* --clobber

  verify:
    name: Verify release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/verify-release.mjs

  # Installs the published pre-release with the installer scripts from this
  # tag (the ones promotion deploys to yambuck.com), exactly as users will.
  install-test:
    name: Install test Linux
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      # Shared runner IPs exhaust GitHub's anonymous API rate limit.
      YAMBUCK_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The tarball ships a plain binary; a desktop already has these
      # libraries, a bare runner does not.
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0

      - name: Install (user, ~/.local/bin)
        run: |
          bash docs/install.sh --version "$TAG" --yes --no-relaunch
          "$HOME/.local/bin/yambuck" --version | grep -F "${TAG#v}"
          test -f "$HOME/.local/share/applications/com.yambuck.yambuck.desktop"

      # Replaces the user install with the system-wide one (and removes the
      # user copy that would shadow it).
      - name: Install (system, /usr/local/bin)
        run: |
          bash docs/install.sh --version "$TAG" --yes --no-relaunch --system
          /usr/local/bin/yambuck --version | grep -F "${TAG#v}"
          test -f /usr/share/applications/com.yambuck.yambuck.desktop
          test ! -e "$HOME/.local/bin/yambuck"

      - name: Uninstall
        run: |
          bash docs/uninstall.sh --yes
          test ! -e /usr/local/bin/yambuck
          test ! -e "$HOME/.local/bin/yambuck"
          test ! -e /usr/share/applications/com.yambuck.yambuck.desktop
