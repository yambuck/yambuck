<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title | default: site.title }}</title>
{% if page.description %}
<meta name="description" content="{{ page.description }}" />
{% endif %}
{% if page.canonical %}
<link rel="canonical" href="{{ page.canonical }}" />
{% endif %}
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" />
<link rel="preload" href="{{ '/assets/fonts/inter-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="{{ '/assets/fonts/inter-latin-300-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
