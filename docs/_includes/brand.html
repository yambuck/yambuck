<div class="brand">

    <span>Yambuck</span>
  </div>
  {% else %}
  <a class="brand-lockup" href="{{ '/index.html' | relative_url }}" aria-label="Yambuck home page">

    <span>Yambuck</span>

  <a class="byline" href="https://brumley.info/">by Jack Brumley</a>
</div>
